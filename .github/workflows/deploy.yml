
name: Deploy to AWS

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: simple-devops-app
  ECR_REGISTRY: 043105573122.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-02a78c1c1d325093d

jobs:
  deploy:
    name: Build, Push and Deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Prepare deployment script
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          image_uri = os.environ["ECR_REGISTRY"] + "/" + os.environ["ECR_REPOSITORY"] + ":" + os.environ["IMAGE_TAG"]
          region = os.environ["AWS_REGION"]
          registry = os.environ["ECR_REGISTRY"]

          script = r"""#!/bin/bash
          set -eu

          IMAGE_URI="__IMAGE_URI__"
          REGION="__REGION__"
          REGISTRY="__REGISTRY__"

          aws ecr get-login-password --region "$REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE_URI"

          # Start the candidate on localhost only.
          docker rm -f simple-devops-candidate >/dev/null 2>&1 || true
          docker run -d --name simple-devops-candidate \
            -p 127.0.0.1:5001:5000 "$IMAGE_URI"

          healthy=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5001/health; then
              healthy=1
              break
            fi
            sleep 3
          done

          docker rm -f simple-devops-candidate >/dev/null 2>&1 || true

          if [ "$healthy" -ne 1 ]; then
            echo "Candidate health check failed. Existing application preserved."
            exit 1
          fi

          # Replace the production container after candidate validation.
          docker rm -f simple-devops-app >/dev/null 2>&1 || true
          docker run -d --name simple-devops-app \
            -p 5000:5000 --restart unless-stopped "$IMAGE_URI"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 3
          done

          echo "Production health check failed."
          docker logs simple-devops-app || true
          exit 1
          """

          script = (
              script
              .replace("__IMAGE_URI__", image_uri)
              .replace("__REGION__", region)
              .replace("__REGISTRY__", registry)
          )

          with open("ssm-parameters.json", "w", encoding="utf-8") as f:
              json.dump({"commands": [script]}, f)
          PY

      - name: Send deployment command to EC2
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy simple-devops-app ${IMAGE_TAG}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment and verify health
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for the deployment command."
          exit 1
