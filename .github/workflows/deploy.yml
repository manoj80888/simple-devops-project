name: Deploy to AWS EC2

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: simple-devops-app
  EC2_INSTANCE_ID: i-02a78c1c1d325093d

jobs:
  deploy:
    name: Build and deploy application
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043105573122:role/GitHubActions-SimpleDevOps-DeployRole
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment command
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          python - <<'PY'
          import json
          import os

          image_uri = os.environ["IMAGE_URI"]

          script = r"""
          set -euo pipefail

          IMAGE_URI='__IMAGE_URI__'

          echo "Pulling application image..."
          docker pull "$IMAGE_URI"

          echo "Starting candidate container..."
          docker rm -f simple-devops-candidate >/dev/null 2>&1 || true

          docker run -d \
            --name simple-devops-candidate \
            -p 127.0.0.1:5001:5000 \
            "$IMAGE_URI"

          candidate_healthy=0

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5001/health; then
              candidate_healthy=1
              break
            fi
            sleep 3
          done

          docker rm -f simple-devops-candidate >/dev/null 2>&1 || true

            if [ "$candidate_healthy" -ne 1 ]; then
             echo "Candidate health check failed."
             docker logs simple-devops-candidate 2>/dev/null || true
             docker rm -f simple-devops-candidate >/dev/null 2>&1 || true
             exit 1
          fi

          docker rm -f simple-devops-candidate >/dev/null 2>&1 || true
          echo "Candidate health check passed."

          # Remember the currently deployed image for rollback.
          OLD_IMAGE=""

          if docker inspect simple-devops-app >/dev/null 2>&1; then
            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' simple-devops-app)
          fi

          echo "Replacing the production container..."
          docker rm -f simple-devops-app >/dev/null 2>&1 || true

          docker run -d \
            --name simple-devops-app \
            -p 5000:5000 \
            --restart unless-stopped \
            "$IMAGE_URI"

          production_healthy=0

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5000/health; then
              production_healthy=1
              break
            fi
            sleep 3
          done

          if [ "$production_healthy" -eq 1 ]; then
            echo "Production health check passed."
            exit 0
          fi

          echo "New production container failed its health check."
          docker logs simple-devops-app || true
          docker rm -f simple-devops-app >/dev/null 2>&1 || true

          # Roll back when a previous production image exists.
          if [ -n "$OLD_IMAGE" ]; then
            echo "Rolling back to previous image: $OLD_IMAGE"

            if docker run -d \
              --name simple-devops-app \
              -p 5000:5000 \
              --restart unless-stopped \
              "$OLD_IMAGE"; then

              rollback_healthy=0

              for i in $(seq 1 20); do
                if curl -fsS http://127.0.0.1:5000/health; then
                  rollback_healthy=1
                  break
                fi
                sleep 3
              done

              if [ "$rollback_healthy" -eq 1 ]; then
                echo "Rollback succeeded; the previous version is running."
              else
                echo "Rollback health check failed."
                docker logs simple-devops-app || true
              fi
            else
              echo "Could not restart the previous image."
            fi
          else
            echo "No previous production image was found for rollback."
          fi

          echo "Deployment failed; investigate the container and SSM logs."
          exit 1
          """

          script = script.replace("__IMAGE_URI__", image_uri)

          parameters = {
              "commands": [
                  "cat > /tmp/deploy-simple-devops.sh <<'DEPLOY_SCRIPT'",
                  *script.splitlines(),
                  "DEPLOY_SCRIPT",
                  "chmod 700 /tmp/deploy-simple-devops.sh",
                  "bash /tmp/deploy-simple-devops.sh"
              ]
          }

          with open("ssm-parameters.json", "w", encoding="utf-8") as file:
              json.dump(parameters, file)
          PY

      - name: Send deployment command to EC2
        id: send-command
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy simple-devops-app from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

      - name: Wait for deployment result
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment command completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment command failed."
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
